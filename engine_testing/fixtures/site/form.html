<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aster QA Fixture — Form</title>
<style>body { font-family: sans-serif; margin: 2rem; }</style>
</head>
<body>
<h1>Settings</h1>
<form onsubmit="return false;">
  <p><label for="name">Name</label>
     <input id="name" type="text" placeholder="Your name"></p>
  <p><label for="email">Email</label>
     <input id="email" type="email" placeholder="you@example.com"></p>
  <p><label for="notes">Notes</label>
     <textarea id="notes" placeholder="Notes"></textarea></p>
  <button id="save" type="submit">Save</button>
  <button id="reset" type="reset">Reset</button>
</form>
<p id="status" role="status">idle</p>
<script>
  document.getElementById('save').addEventListener('click', () => {
    document.getElementById('status').textContent =
      'saved:' + document.getElementById('name').value;
  });
</script>
</body>
</html>
