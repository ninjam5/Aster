# Aster — Secrets Template
#
# Copy this file to `secrets.yaml` (gitignored — never commit the real one)
# and fill in whichever integrations you want. Every field is optional:
# leaving a block blank simply disables that integration, and the rest of
# Aster keeps working. `first_run_setup.py` will write this file for you
# interactively if you'd rather not edit YAML by hand.
#
# config.py loads this file the same way it loads self_config.yaml —
# missing file, missing keys, and blank values all fall back gracefully.
# Nothing here is ever exposed through the `get_my_config` introspection
# tool (that only reads self_config.yaml).

spotify:
  # Register your own app at https://developer.spotify.com/dashboard
  client_id: ""
  client_secret: ""
  # Must exactly match the redirect URI registered on your Spotify app.
  # Default port here (8081) deliberately avoids llama-server's port 8080.
  redirect_uri: "http://127.0.0.1:8081"

telegram:
  # Create a bot via @BotFather on Telegram to get a token.
  bot_token: ""
  # Your personal chat ID — message your new bot once and
  # first_run_setup.py will capture this automatically. 0 = unset.
  authorized_chat_id: 0

discord:
  # Create a bot at https://discord.com/developers/applications
  bot_token: ""

livekit:
  # From your LiveKit Cloud project (or a self-hosted server).
  url: ""
  api_key: ""
  api_secret: ""

deepgram:
  # Optional — cloud STT+TTS for LiveKit calls when self_config.yaml sets
  # voice.stt_provider / voice.tts_provider to "deepgram" (Flux). Leave blank
  # to stay fully local; a blank key silently keeps the local engine.
  # Get a key at https://console.deepgram.com
  api_key: ""

firecrawl:
  # Optional — only used as a fallback when Wikipedia has no result.
  # Get a free-tier key at https://www.firecrawl.dev
  api_key: ""

google:
  # Gmail + Calendar. Create a project at https://console.cloud.google.com,
  # enable the Gmail API and Calendar API, configure an OAuth consent screen
  # (External, Testing status — add your own account as a test user), and
  # create an OAuth client of type "Desktop app". Paste its id/secret below.
  # Note: Google issues short-lived (~7 day) refresh tokens for personal-use
  # apps in Testing status — Aster will remind you to re-authorize before it
  # lapses rather than pursuing the disproportionate verification process.
  client_id: ""
  client_secret: ""
